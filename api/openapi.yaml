        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Admin - Staff]
      summary: Create another staff account
      description: Staff accounts cannot self-register. The password is a temporary one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffRequest' }
            example:
              firstName: Marcus
              lastName: Ashworth
              email: marcus.ashworth@prestige.test
              password: Temporary2026
              phone: '+44 20 7946 0102'
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: td_session
      description: JWT session cookie set by the login and register endpoints.
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageIdPath:
      name: imageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    TimeZone:
      name: timeZone
      in: query
      description: IANA time zone used for "today", "this month" and the trend's days.
      schema: { type: string, default: UTC }
      example: Europe/London
  schemas:
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - EMAIL_TAKEN
        - INVALID_CREDENTIALS
        - INVALID_CURRENT_PASSWORD
        - ACCOUNT_DISABLED
        - SLOT_UNAVAILABLE
        - BOOKING_CONFLICT
        - SLOT_IN_PAST
        - CANCELLATION_WINDOW_PASSED
        - INVALID_STATUS_TRANSITION
        - HAS_ACTIVE_BOOKINGS
        - ACTIVE_BOOKING_LIMIT
        - SLOT_OVERLAP
        - UPLOAD_INVALID
        - INTERNAL_ERROR
    ErrorDetail:
      type: object
      required: [message]
      properties:
        field: { type: string, example: email }
        message: { type: string, example: Enter a valid email address }
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              items: { $ref: '#/components/schemas/ErrorDetail' }
    PageMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page: { type: integer, example: 1 }
        pageSize: { type: integer, example: 10 }
        total: { type: integer, example: 42 }
        totalPages: { type: integer, example: 5 }
    BookingStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, CANCELLED, COMPLETED, RESCHEDULED]
    Role:
      type: string
      enum: [CUSTOMER, STAFF]
    VehicleType:
      type: string
      enum: [SEDAN, SUV, COUPE, CONVERTIBLE, HATCHBACK, SPORTS, GRAND_TOURER, MPV]
    FuelType:
      type: string
      enum: [PETROL, DIESEL, HYBRID, PLUG_IN_HYBRID, ELECTRIC]
    Transmission:
      type: string
      enum: [AUTOMATIC, MANUAL, DUAL_CLUTCH]
    NotificationType:
      type: string
      enum: [BOOKING_CREATED, BOOKING_APPROVED, BOOKING_REJECTED, BOOKING_RESCHEDULED, BOOKING_CANCELLED, BOOKING_COMPLETED]

    # ------------------------------------------------------ requests
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password, confirmPassword, phone]
      properties:
        firstName: { type: string, maxLength: 80 }
        lastName: { type: string, maxLength: 80 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72, description: 'At least one letter and one number.' }
        confirmPassword: { type: string }
        phone: { type: string }
        drivingLicenseNumber: { type: string, minLength: 5, maxLength: 30 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        drivingLicenseNumber: { type: string, nullable: true }
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword, confirmPassword]
      properties:
        currentPassword: { type: string }
        newPassword: { type: string, minLength: 8, maxLength: 72 }
        confirmPassword: { type: string }
    CreateStaffRequest:
      type: object
      required: [firstName, lastName, email, password, phone]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
        phone: { type: string }
    CreateBookingRequest:
      type: object
      required: [slotId]
      properties:
        slotId: { type: string, format: uuid }
        customerNote: { type: string, maxLength: 500, nullable: true }
    CancelMyBookingRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500, nullable: true }
    ApproveRequest:
      type: object
      properties:
        staffNote: { type: string, maxLength: 500, nullable: true }
    RejectRequest:
      type: object
      required: [rejectionReason]
      properties:
        rejectionReason: { type: string, minLength: 5, maxLength: 500 }
    StaffCancelRequest:
      type: object
      required: [cancellationReason]
      properties:
        cancellationReason: { type: string, minLength: 5, maxLength: 500 }
    CompleteRequest:
      type: object
      properties:
        staffNote: { type: string, maxLength: 500, nullable: true }
    RescheduleRequest:
      type: object
      required: [newSlotId]
      properties:
        newSlotId: { type: string, format: uuid }
        note: { type: string, maxLength: 500, nullable: true }
    CustomerStatusRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }
    CreateVehicleRequest:
      type: object
      required: [manufacturer, model, year, vehicleType, fuelType, transmission, engine, powerHp, seats, color, description]
      properties:
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer, minimum: 1990, description: 'Up to next year.' }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        fuelType: { $ref: '#/components/schemas/FuelType' }
        transmission: { $ref: '#/components/schemas/Transmission' }
        engine: { type: string }
        powerHp: { type: integer, minimum: 1 }
        topSpeedKmh: { type: integer, nullable: true }
        acceleration0to100: { type: number, nullable: true }
        seats: { type: integer, minimum: 1, maximum: 9 }
        color: { type: string }
        priceFrom: { type: number, nullable: true }
        description: { type: string, minLength: 10, maxLength: 5000 }
        features: { type: array, maxItems: 20, items: { type: string, maxLength: 60 } }
        availabilityNote: { type: string, nullable: true }
    UpdateVehicleRequest:
      type: object
      minProperties: 1
      description: Any subset of the create fields.
      properties:
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        fuelType: { $ref: '#/components/schemas/FuelType' }
        transmission: { $ref: '#/components/schemas/Transmission' }
        engine: { type: string }
        powerHp: { type: integer }
        topSpeedKmh: { type: integer, nullable: true }
        acceleration0to100: { type: number, nullable: true }
        seats: { type: integer }
        color: { type: string }
        priceFrom: { type: number, nullable: true }
        description: { type: string }
        features: { type: array, items: { type: string } }
        availabilityNote: { type: string, nullable: true }
    ReplaceDealershipsRequest:
      type: object
      required: [dealerships]
      properties:
        dealerships:
          type: array
          items:
            type: object
            required: [dealershipId, isAvailable]
            properties:
              dealershipId: { type: string, format: uuid }
              isAvailable: { type: boolean }
    UpdateImageRequest:
      type: object
      minProperties: 1
      properties:
        altText: { type: string, maxLength: 160 }
        sortOrder: { type: integer, minimum: 0, maximum: 1000 }
        isPrimary: { type: boolean }
    CreateDealershipRequest:
      type: object
      required: [name, address, city, phone, email, openingHours]
      properties:
        name: { type: string, minLength: 2, maxLength: 120 }
        address: { type: string }
        city: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        openingHours: { type: string }
        description: { type: string, nullable: true }
    UpdateDealershipRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string }
        address: { type: string }
        city: { type: string }
        phone: { type: string }
        email: { type: string, format: email }
        openingHours: { type: string }
        description: { type: string, nullable: true }
    CreateSlotRequest:
      type: object
      required: [dealershipId, vehicleId, startAt, endAt]
      properties:
        dealershipId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        startAt: { type: string, format: date-time, description: 'ISO 8601 with offset.' }
        endAt: { type: string, format: date-time }
    UpdateSlotRequest:
      type: object
      minProperties: 1
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
    BulkSlotsRequest:
      type: object
      required: [dealershipId, vehicleId, dateFrom, dateTo, daysOfWeek, dailyStartTime, dailyEndTime, durationMinutes]
      properties:
        dealershipId: { type: string, format: uuid }
        vehicleId: { type: string, format: uuid }
        dateFrom: { type: string, format: date, description: 'YYYY-MM-DD.' }
        dateTo: { type: string, format: date }
        daysOfWeek: { type: array, items: { type: string, enum: [MON, TUE, WED, THU, FRI, SAT, SUN] } }
        dailyStartTime: { type: string, example: '09:00' }
        dailyEndTime: { type: string, example: '17:00' }
        durationMinutes: { type: integer, minimum: 15, maximum: 240 }
        breakMinutes: { type: integer, minimum: 0, maximum: 240, default: 0 }
        timeZone: { type: string, default: UTC }

    # ------------------------------------------------------ entities
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        firstName: { type: string }
        lastName: { type: string }
        phone: { type: string }
        drivingLicenseNumber: { type: string, nullable: true }
        isActive: { type: boolean }
        lastLoginAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    UserPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/User' } }
    ImageRef:
      type: object
      nullable: true
      properties:
        url: { type: string, example: /uploads/vehicles/7e1f4a93-2b6c-4d8e-a5f0-9c3b1d7e2a46/0f2c.png }
        altText: { type: string }
    Image:
      type: object
      properties:
        id: { type: string, format: uuid }
        url: { type: string }
        altText: { type: string }
        isPrimary: { type: boolean }
        sortOrder: { type: integer }
    DealershipSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
    PublicDealership:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        phone: { type: string }
        email: { type: string }
        openingHours: { type: string }
        description: { type: string, nullable: true }
    AdminDealership:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { type: string }
        city: { type: string }
        phone: { type: string }
        email: { type: string }
        openingHours: { type: string }
        description: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        vehicleCount: { type: integer }
    AdminDealershipDetail:
      allOf:
        - $ref: '#/components/schemas/AdminDealership'
        - type: object
          properties:
            upcomingActiveBookingCount: { type: integer }
    AdminDealershipPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminDealership' } }
    CatalogListItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        fuelType: { $ref: '#/components/schemas/FuelType' }
        transmission: { $ref: '#/components/schemas/Transmission' }
        priceFrom: { type: number, nullable: true }
        primaryImage: { $ref: '#/components/schemas/Image' }
        dealerships: { type: array, items: { $ref: '#/components/schemas/DealershipSummary' } }
        nextAvailableSlotAt: { type: string, format: date-time, nullable: true }
    CatalogPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/CatalogListItem' } }
    CatalogVehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        fuelType: { $ref: '#/components/schemas/FuelType' }
        transmission: { $ref: '#/components/schemas/Transmission' }
        engine: { type: string }
        powerHp: { type: integer }
        topSpeedKmh: { type: integer, nullable: true }
        acceleration0to100: { type: number, nullable: true }
        seats: { type: integer }
        color: { type: string }
        priceFrom: { type: number, nullable: true }
        description: { type: string }
        features: { type: array, items: { type: string } }
        availabilityNote: { type: string, nullable: true }
        images: { type: array, items: { $ref: '#/components/schemas/Image' } }
        dealerships:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/PublicDealership'
              - type: object
                properties:
                  upcomingAvailableSlots: { type: integer }
    CatalogFilters:
      type: object
      properties:
        manufacturers: { type: array, items: { type: string } }
        models:
          type: array
          items:
            type: object
            properties:
              manufacturer: { type: string }
              models: { type: array, items: { type: string } }
        vehicleTypes: { type: array, items: { $ref: '#/components/schemas/VehicleType' } }
        fuelTypes: { type: array, items: { $ref: '#/components/schemas/FuelType' } }
        transmissions: { type: array, items: { $ref: '#/components/schemas/Transmission' } }
        yearRange:
          type: object
          nullable: true
          properties:
            min: { type: integer }
            max: { type: integer }
        priceRange:
          type: object
          nullable: true
          properties:
            min: { type: number }
            max: { type: number }
        cities: { type: array, items: { type: string } }
    SlotPreview:
      type: object
      properties:
        id: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        isAvailable: { type: boolean }
        cancellationWindowHours: { type: number }
        dealership:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string }
            city: { type: string }
            phone: { type: string }
            openingHours: { type: string }
        vehicle:
          type: object
          properties:
            id: { type: string, format: uuid }
            manufacturer: { type: string }
            model: { type: string }
            year: { type: integer }
            primaryImage: { $ref: '#/components/schemas/ImageRef' }
    SlotAvailability:
      type: object
      properties:
        vehicleId: { type: string, format: uuid }
        timeZone: { type: string }
        range:
          type: object
          properties:
            from: { type: string, format: date-time }
            to: { type: string, format: date-time }
        dates: { type: array, items: { type: string, format: date, example: '2030-03-12' } }
        slotsByDate:
          type: object
          additionalProperties:
            type: array
            items:
              type: object
              properties:
                id: { type: string, format: uuid }
                startAt: { type: string, format: date-time }
                endAt: { type: string, format: date-time }
                dealership: { $ref: '#/components/schemas/DealershipSummary' }
    AdminVehicle:
      type: object
      properties:
        id: { type: string, format: uuid }
        manufacturer: { type: string }
        model: { type: string }
        year: { type: integer }
        vehicleType: { $ref: '#/components/schemas/VehicleType' }
        fuelType: { $ref: '#/components/schemas/FuelType' }
        transmission: { $ref: '#/components/schemas/Transmission' }
        engine: { type: string }
        powerHp: { type: integer }
        topSpeedKmh: { type: integer, nullable: true }
        acceleration0to100: { type: number, nullable: true }
        seats: { type: integer }
        color: { type: string }
        priceFrom: { type: number, nullable: true }
        description: { type: string }
        features: { type: array, items: { type: string } }
        availabilityNote: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AdminVehicleListItem:
      allOf:
        - $ref: '#/components/schemas/AdminVehicle'
        - type: object
          properties:
            primaryImage: { $ref: '#/components/schemas/Image' }
            dealershipCount: { type: integer }
    AdminVehiclePage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminVehicleListItem' } }
    VehicleDealership:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        city: { type: string }
        isActive: { type: boolean }
        isAvailable: { type: boolean }
    AdminVehicleDetail:
      allOf:
        - $ref: '#/components/schemas/AdminVehicle'
        - type: object
          properties:
            images: { type: array, items: { $ref: '#/components/schemas/Image' } }
            dealerships: { type: array, items: { $ref: '#/components/schemas/VehicleDealership' } }
            upcomingActiveBookingCount: { type: integer }
    AdminSlot:
      type: object
      properties:
        id: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        dealership: { $ref: '#/components/schemas/DealershipSummary' }
        vehicle:
          type: object
          properties:
            id: { type: string, format: uuid }
            manufacturer: { type: string }
            model: { type: string }
        activeBooking:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/BookingStatus' }
            customer:
              type: object
              properties:
                id: { type: string, format: uuid }
                firstName: { type: string }
                lastName: { type: string }
                email: { type: string }
    AdminSlotPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminSlot' } }
    BulkSlots:
      type: object
      properties:
        dryRun: { type: boolean }
        slots:
          type: array
          description: Slots created (or, in a dry run, that would be created).
          items:
            type: object
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
        skipped:
          type: array
          items:
            type: object
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
              reason: { type: string, enum: [IN_PAST, OVERLAPS_EXISTING] }
              clashingSlot:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  startAt: { type: string, format: date-time }
                  endAt: { type: string, format: date-time }
                  dealershipName: { type: string }
        totals:
          type: object
          properties:
            candidates: { type: integer }
            slots: { type: integer }
            skipped: { type: integer }
    BookingCustomer:
      type: object
      properties:
        id: { type: string, format: uuid }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string }
    Booking:
      type: object
      description: The booking returned when it is created or changed.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/BookingStatus' }
        customerNote: { type: string, nullable: true }
        staffNote: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        cancellationReason: { type: string, nullable: true }
        cancelledBy: { allOf: [{ $ref: '#/components/schemas/Role' }], nullable: true }
        approvedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        customer: { $ref: '#/components/schemas/BookingCustomer' }
        slot:
          type: object
          properties:
            id: { type: string, format: uuid }
            startAt: { type: string, format: date-time }
            endAt: { type: string, format: date-time }
        vehicle:
          type: object
          properties:
            id: { type: string, format: uuid }
            manufacturer: { type: string }
            model: { type: string }
            year: { type: integer }
            primaryImage: { $ref: '#/components/schemas/ImageRef' }
        dealership:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            address: { type: string }
            city: { type: string }
            phone: { type: string }
    AdminBookingItem:
      allOf:
        - $ref: '#/components/schemas/Booking'
        - type: object
          description: Adds `customer.name` and `vehicle.name`.
    AdminBookingPage:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          properties:
            items: { type: array, items: { $ref: '#/components/schemas/AdminBookingItem' } }
    TimelineSlot:
      type: object
      nullable: true
      properties:
        id: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        dealership:
          type: object
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    AdminBookingDetail:
      type: object
      properties:
        id: { type: string, format: uuid }
