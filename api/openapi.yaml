        '200':
          $ref: '#/components/responses/AdminVehiclePageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Admin - Vehicles]
      summary: Create a vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVehicleRequest' }
            example:
              manufacturer: Aston Martin
              model: Vantage
              year: 2025
              vehicleType: SPORTS
              fuelType: PETROL
              transmission: AUTOMATIC
              engine: 4.0L twin-turbo V8
              powerHp: 656
              topSpeedKmh: 325
              acceleration0to100: 3.5
              seats: 2
              color: Lunar White
              priceFrom: 165000
              description: A razor-sharp British sports car with a muscular V8.
              features: [Launch control, Bowers & Wilkins audio]
              availabilityNote: Available by appointment
      responses:
        '201':
          $ref: '#/components/responses/AdminVehicleCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/vehicles/{id}:
    get:
      tags: [Admin - Vehicles]
