openapi: 3.0.3
info:
  title: Prestige Test Drive API
  version: 1.0.0
  description: |
    REST API for the Luxury Car Test-Drive Booking and Management System.

    **Conventions**
    - Every response uses an envelope: `{ "success": true, "data": ..., "message": "optional" }` on success and
      `{ "success": false, "error": { "code": "MACHINE_CODE", "message": "...", "details": [{ "field": "...", "message": "..." }] } }` on failure.
    - Authentication is a JWT in an httpOnly, SameSite=Lax cookie named `td_session`, set by `POST /api/auth/login`
      or `POST /api/auth/register`. Two roles exist: `CUSTOMER` and `STAFF`.
    - Request bodies, query strings and path parameters are validated; unknown fields are rejected with `422`.
    - All identifiers are UUIDs and all timestamps are ISO 8601 in UTC.
    - Lists are paginated with `page` (from 1) and `pageSize` (1 to 50, default 10).
    - Multi-value filters accept a comma-separated list (`status=PENDING,APPROVED`) or repeated parameters.
    - Error codes and their HTTP statuses are listed in `docs/api-error-codes.md`.

    **Try it:** sign in with `POST /api/auth/login` (demo accounts are printed by `npm run db:seed`), then call any
    other endpoint from this page; the browser sends the session cookie automatically.
servers:
  - url: http://localhost:4000
    description: API server directly
  - url: http://localhost:3000
    description: Through the web application's proxy (same origin as the browser)
tags:
  - name: Health
  - name: Auth
  - name: Profile
  - name: Catalog
  - name: Dealerships
  - name: Slots
  - name: Bookings
  - name: Notifications
  - name: Admin - Bookings
  - name: Admin - Dashboard
  - name: Admin - Vehicles
  - name: Admin - Dealerships
  - name: Admin - Slots
  - name: Admin - Customers
  - name: Admin - Staff
security:
  - cookieAuth: []
paths:
  /api/health:
    get:
      tags: [Health]
      summary: Service and database health
      security: []
      responses:
        '200':
          $ref: '#/components/responses/HealthResponse'
        '503':
          description: The database is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------------------------------------------- Auth
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a customer account and sign in
      description: Always creates a `CUSTOMER`. A `role` in the body is ignored. Rate limited per IP and email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
            example:
              firstName: Charlotte
              lastName: Ainsworth
              email: charlotte.ainsworth@example.com
              password: Velvet2026
              confirmPassword: Velvet2026
              phone: '+44 7700 900777'
              drivingLicenseNumber: AINSW901015C99XY
      responses:
        '201':
          $ref: '#/components/responses/UserCreatedResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in (customers and staff)
      description: |
        Sets the session cookie. Unknown email and wrong password give the same `INVALID_CREDENTIALS` answer.
        A deactivated account gets `ACCOUNT_DISABLED`. Rate limited per IP and email.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            examples:
              customer:
                summary: Demo customer
                value: { email: amelia.hart@prestige.test, password: 'Prestige#2026' }
              staff:
                summary: Demo staff member
                value: { email: staff1@prestige.test, password: 'Prestige#2026' }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/AccountDisabled'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Clears the session cookie. Works even when nobody is signed in.
      security: []
      responses:
        '200':
          $ref: '#/components/responses/NullResponse'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: The signed-in user
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/AccountDisabled'

  # ------------------------------------------------------------- Profile
  /api/profile:
    get:
      tags: [Profile]
      summary: Own profile (customers and staff)
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags: [Profile]
      summary: Update own profile
      description: |
        Email cannot be changed (it is the login identity). Unknown fields, including `email`, are rejected.
        `drivingLicenseNumber` can be cleared with `null`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
            example: { firstName: Amelia, lastName: Hart-Lowe, phone: '+44 7700 900999' }
      responses:
        '200':
          $ref: '#/components/responses/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/profile/password:
    patch:
      tags: [Profile]
      summary: Change own password
      description: A wrong current password returns `400 INVALID_CURRENT_PASSWORD`. Rate limited per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
            example: { currentPassword: Velvet2026, newPassword: Brand-new-2026, confirmPassword: Brand-new-2026 }
      responses:
        '200':
          $ref: '#/components/responses/NullResponse'
        '400':
          description: The current password is incorrect (`INVALID_CURRENT_PASSWORD`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'

  # ------------------------------------------------------------- Catalog
  /api/vehicles:
    get:
      tags: [Catalog]
      summary: Browse, search and filter vehicles
      description: Public. Only active vehicles are returned. Unknown parameters and values are rejected.
      security: []
      parameters:
        - { name: q, in: query, description: 'Free text over make, model, description and features. Every word must match.', schema: { type: string, maxLength: 100 } }
        - { name: manufacturer, in: query, description: 'One or more manufacturers (comma-separated or repeated).', schema: { type: string }, example: 'Audi,Bentley' }
        - { name: model, in: query, description: 'One or more models.', schema: { type: string } }
        - { name: vehicleType, in: query, description: 'One or more vehicle types.', schema: { type: string }, example: 'SUV,COUPE' }
        - { name: fuelType, in: query, description: 'One or more fuel types.', schema: { type: string }, example: 'ELECTRIC,PLUG_IN_HYBRID' }
        - { name: transmission, in: query, description: 'One or more transmissions.', schema: { type: string } }
        - { name: dealershipId, in: query, schema: { type: string, format: uuid } }
        - { name: city, in: query, schema: { type: string } }
        - { name: minYear, in: query, schema: { type: integer } }
        - { name: maxYear, in: query, schema: { type: integer } }
        - { name: minPrice, in: query, schema: { type: number } }
        - { name: maxPrice, in: query, schema: { type: number } }
        - { name: availableOnly, in: query, description: 'Only vehicles with at least one bookable future slot.', schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [newest, priceAsc, priceDesc, manufacturerAsc, powerDesc], default: newest } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          $ref: '#/components/responses/CatalogPageResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/vehicles/filters:
    get:
      tags: [Catalog]
      summary: Filter options currently present in the data
      security: []
      responses:
        '200':
          $ref: '#/components/responses/CatalogFiltersResponse'
  /api/vehicles/{id}:
    get:
      tags: [Catalog]
      summary: Vehicle details
      description: An inactive or unknown vehicle returns 404.
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/CatalogVehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/vehicles/{vehicleId}/slots:
    get:
      tags: [Slots]
      summary: Available test-drive slots for a vehicle
      description: |
        Only genuinely bookable slots (active, in the future, unbooked, at an active dealership offering the vehicle).
        Default range is the next 14 days, at most 60. Slots are grouped by calendar date in `timeZone`.
      security: []
      parameters:
        - { name: vehicleId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: dealershipId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, description: 'ISO 8601 with offset. Defaults to now.', schema: { type: string, format: date-time } }
        - { name: to, in: query, description: 'ISO 8601 with offset. Defaults to 14 days after `from`.', schema: { type: string, format: date-time } }
        - { name: timeZone, in: query, description: 'IANA time zone used to group slots by date.', schema: { type: string, default: UTC }, example: Europe/London }
      responses:
        '200':
          $ref: '#/components/responses/SlotAvailabilityResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # --------------------------------------------------------- Dealerships
  /api/dealerships:
    get:
      tags: [Dealerships]
      summary: Active dealerships
      description: Public. At most 100 are returned.
      security: []
      parameters:
        - { name: vehicleId, in: query, description: 'Only dealerships currently offering this vehicle.', schema: { type: string, format: uuid } }
        - { name: city, in: query, schema: { type: string } }
      responses:
        '200':
          $ref: '#/components/responses/DealershipListResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/dealerships/{id}:
    get:
      tags: [Dealerships]
      summary: Dealership details
      security: []
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/DealershipResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------------ Bookings
  /api/bookings:
    post:
      tags: [Bookings]
      summary: Request a test drive (customers only)
      description: |
        Runs in one transaction with row locks: of many simultaneous requests for one slot exactly one succeeds and
        the others receive `SLOT_UNAVAILABLE`. Also enforces no overlapping bookings (`BOOKING_CONFLICT`) and at most
        three active bookings (`ACTIVE_BOOKING_LIMIT`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingRequest' }
            example: { slotId: 6b2c9d4e-0f8a-4a52-9a67-1d3b5c7e9f01, customerNote: Interested in the manual gearbox. }
      responses:
        '201':
          $ref: '#/components/responses/BookingCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/bookings/mine:
    get:
      tags: [Bookings]
      summary: Own bookings by view (customers only)
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [pending, upcoming, completed, cancelled, previous, all], default: all } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          $ref: '#/components/responses/MyBookingPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/bookings/mine/counts:
    get:
      tags: [Bookings]
      summary: Number of bookings in every view
      responses:
        '200':
          $ref: '#/components/responses/MyBookingCountsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/bookings/slots/{id}:
    get:
      tags: [Bookings]
      summary: Slot summary for the booking confirmation page (customers only)
      description: |
        Returns the vehicle, dealership and times of a slot, whether it can still be booked (`isAvailable`)
        and the cancellation window in hours. Slots of deactivated vehicles or dealerships are reported as not found.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/SlotPreviewResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/bookings/{id}:
    get:
      tags: [Bookings]
      summary: Own booking with its status timeline
      description: Another customer's booking returns the same 404 as an unknown one.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/MyBookingDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/bookings/{id}/cancel:
    patch:
      tags: [Bookings]
      summary: Cancel own booking
      description: |
        Allowed for pending, approved or rescheduled bookings whose slot starts at least `CANCELLATION_WINDOW_HOURS`
        (24) from now. Otherwise `CANCELLATION_WINDOW_PASSED` or `INVALID_STATUS_TRANSITION`. The booking's
        `canCancel` field is computed by the same rule.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelMyBookingRequest' }
            example: { reason: My plans have changed. }
      responses:
        '200':
          $ref: '#/components/responses/MyBookingDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ------------------------------------------------------- Notifications
  /api/notifications:
    get:
      tags: [Notifications]
      summary: Own notifications, newest first
      parameters:
        - { name: unreadOnly, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          $ref: '#/components/responses/NotificationPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Number of unread notifications
      responses:
        '200':
          $ref: '#/components/responses/UnreadCountResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/notifications/read-all:
    patch:
      tags: [Notifications]
      summary: Mark every own notification as read
      responses:
        '200':
          $ref: '#/components/responses/ReadAllResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /api/notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Mark one notification as read (idempotent)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/NotificationResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------- Admin - Bookings
  /api/admin/bookings:
    get:
      tags: [Admin - Bookings]
      summary: Filter and search all bookings (staff)
      parameters:
        - { name: status, in: query, description: 'One or more statuses (comma-separated or repeated).', schema: { type: string }, example: 'PENDING,APPROVED' }
        - { name: dealershipId, in: query, schema: { type: string, format: uuid } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: customerId, in: query, schema: { type: string, format: uuid } }
        - { name: q, in: query, description: 'Customer name, email or phone, or vehicle make or model.', schema: { type: string, maxLength: 100 } }
        - { name: dateFrom, in: query, description: 'Slot start, inclusive. ISO 8601 with offset.', schema: { type: string, format: date-time } }
        - { name: dateTo, in: query, description: 'Slot start, inclusive. ISO 8601 with offset.', schema: { type: string, format: date-time } }
        - { name: createdFrom, in: query, schema: { type: string, format: date-time } }
        - { name: createdTo, in: query, schema: { type: string, format: date-time } }
        - { name: upcomingOnly, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [slotStartAsc, slotStartDesc, createdDesc], default: createdDesc } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          $ref: '#/components/responses/AdminBookingPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/bookings/{id}:
    get:
      tags: [Admin - Bookings]
      summary: Full booking with customer profile and history (staff)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/AdminBookingDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/bookings/{id}/approve:
    patch:
      tags: [Admin - Bookings]
      summary: Approve a pending booking
      description: PENDING to APPROVED. Writes history, notifies the customer, then attempts an email.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApproveRequest' }
            example: { staffNote: Please bring your driving licence. }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/bookings/{id}/reject:
    patch:
      tags: [Admin - Bookings]
      summary: Reject a pending booking
      description: PENDING to REJECTED. The slot becomes bookable again.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectRequest' }
            example: { rejectionReason: The vehicle is reserved for a press event on this date. }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/bookings/{id}/reschedule:
    patch:
      tags: [Admin - Bookings]
      summary: Move a booking to another slot of the same vehicle
      description: |
        From PENDING, APPROVED or RESCHEDULED. The new slot must be free and in the future; the customer's other
        bookings may not overlap it. History records the old and new slot.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RescheduleRequest' }
            example: { newSlotId: 9f3d1b7a-4c2e-4e8b-8a55-0c6d2e4f6a18, note: Vehicle service. }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/bookings/{id}/cancel:
    patch:
      tags: [Admin - Bookings]
      summary: Cancel an active booking (any time)
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCancelRequest' }
            example: { cancellationReason: The vehicle has been sold. }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/bookings/{id}/complete:
    patch:
      tags: [Admin - Bookings]
      summary: Complete a booking whose slot has started
      description: From APPROVED or RESCHEDULED, only once the slot start is in the past.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteRequest' }
            example: { staffNote: Customer enjoyed the drive. }
      responses:
        '200':
          $ref: '#/components/responses/BookingResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
        '422':
          $ref: '#/components/responses/ValidationError'

  # --------------------------------------------------- Admin - Dashboard
  /api/admin/dashboard/summary:
    get:
      tags: [Admin - Dashboard]
      summary: Dashboard counts and the bookings that need attention
      parameters:
        - { $ref: '#/components/parameters/TimeZone' }
      responses:
        '200':
          $ref: '#/components/responses/DashboardSummaryResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/dashboard/bookings-trend:
    get:
      tags: [Admin - Dashboard]
      summary: Bookings created per day, zero-filled
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 14 } }
