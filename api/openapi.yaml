  # --------------------------------------------------------- Admin - Slots
  /api/admin/slots:
    get:
      tags: [Admin - Slots]
      summary: List slots with their active booking (staff)
      parameters:
        - { name: dealershipId, in: query, schema: { type: string, format: uuid } }
        - { name: vehicleId, in: query, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: isActive, in: query, schema: { type: boolean } }
        - { name: hasBooking, in: query, description: 'Whether the slot has an active booking.', schema: { type: boolean } }
        - { name: sortOrder, in: query, schema: { type: string, enum: [asc, desc], default: asc } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/PageSize' }
      responses:
        '200':
          $ref: '#/components/responses/AdminSlotPageResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Admin - Slots]
      summary: Create one slot
      description: |
        Must start in the future and last 15 to 240 minutes; the vehicle must be offered at the dealership.
        A clash with another active slot of the same vehicle returns `409 SLOT_OVERLAP` naming the clashing slot.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSlotRequest' }
            example:
              dealershipId: 3c8e1a52-7d4b-4f6a-b2c9-5e0a8d1f7b34
              vehicleId: 7e1f4a93-2b6c-4d8e-a5f0-9c3b1d7e2a46
              startAt: '2030-03-12T10:00:00+00:00'
              endAt: '2030-03-12T11:00:00+00:00'
      responses:
        '201':
          $ref: '#/components/responses/AdminSlotCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SlotOverlap'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/slots/bulk:
    post:
      tags: [Admin - Slots]
      summary: Generate many slots (with dry run)
      description: |
        Calendar dates, 24-hour times and weekdays are interpreted in `timeZone` (daylight saving handled).
        `?dryRun=true` previews without writing. Candidates that overlap existing slots or lie in the past are
        skipped and reported; the rest are created in one transaction.
      parameters:
        - { name: dryRun, in: query, schema: { type: boolean } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkSlotsRequest' }
            example:
              dealershipId: 3c8e1a52-7d4b-4f6a-b2c9-5e0a8d1f7b34
              vehicleId: 7e1f4a93-2b6c-4d8e-a5f0-9c3b1d7e2a46
              dateFrom: '2030-03-11'
              dateTo: '2030-03-17'
              daysOfWeek: [MON, WED, FRI]
              dailyStartTime: '09:00'
              dailyEndTime: '12:00'
              durationMinutes: 60
              breakMinutes: 30
              timeZone: Europe/London
      responses:
        '200':
          $ref: '#/components/responses/BulkSlotsResponse'
        '201':
          $ref: '#/components/responses/BulkSlotsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/slots/{id}:
    get:
      tags: [Admin - Slots]
      summary: One slot
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/AdminSlotResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Admin - Slots]
      summary: Change a slot's times
      description: |
        Blocked with `409 HAS_ACTIVE_BOOKINGS` when the slot has an active booking (reschedule the booking instead)
        and with `409 SLOT_IN_PAST` once the slot has started.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateSlotRequest' }
            example: { startAt: '2030-03-12T14:00:00+00:00', endAt: '2030-03-12T15:00:00+00:00' }
      responses:
        '200':
          $ref: '#/components/responses/AdminSlotResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SlotConflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/slots/{id}/deactivate:
    patch:
      tags: [Admin - Slots]
      summary: Deactivate a slot
      description: Blocked with `409 HAS_ACTIVE_BOOKINGS` while the slot has an active booking.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/AdminSlotResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HasActiveBookings'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/slots/{id}/activate:
    patch:
      tags: [Admin - Slots]
      summary: Reactivate a slot
      description: Re-checks overlaps; a clash returns `409 SLOT_OVERLAP`.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/AdminSlotResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/SlotOverlap'
        '422':
          $ref: '#/components/responses/ValidationError'

