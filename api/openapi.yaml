      responses:
        '200':
          $ref: '#/components/responses/AdminVehicleDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      tags: [Admin - Vehicles]
      summary: Update a vehicle (partial)
      description: Optional fields can be cleared with `null`.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVehicleRequest' }
            example: { color: Racing Yellow, priceFrom: 150000, features: [Sport Chrono, Rear-axle steering] }
      responses:
        '200':
          $ref: '#/components/responses/AdminVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/vehicles/{id}/deactivate:
    patch:
      tags: [Admin - Vehicles]
      summary: Deactivate a vehicle
      description: Blocked with `409 HAS_ACTIVE_BOOKINGS` (and the count) while future active bookings exist.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/AdminVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HasActiveBookings'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/vehicles/{id}/activate:
    patch:
      tags: [Admin - Vehicles]
      summary: Reactivate a vehicle
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/AdminVehicleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/vehicles/{id}/dealerships:
    get:
      tags: [Admin - Vehicles]
      summary: Dealerships offering the vehicle
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      responses:
        '200':
          $ref: '#/components/responses/VehicleDealershipsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      tags: [Admin - Vehicles]
      summary: Replace the dealerships offering the vehicle
      description: |
        Applied in one transaction or not at all. Withdrawing a dealership (omitting it or marking it unavailable) is
        refused while it has future active bookings (`HAS_ACTIVE_BOOKINGS`) or active upcoming slots (`CONFLICT`).
        A dealership that already has slot history is kept as unavailable instead of being deleted.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceDealershipsRequest' }
            example:
              dealerships:
                - { dealershipId: 3c8e1a52-7d4b-4f6a-b2c9-5e0a8d1f7b34, isAvailable: true }
                - { dealershipId: 5a7d2c91-1e3f-4b8a-9c6d-2f4e8a0b1c53, isAvailable: false }
      responses:
        '200':
          $ref: '#/components/responses/VehicleDealershipsResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/HasActiveBookings'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/admin/vehicles/{id}/images:
    post:
      tags: [Admin - Vehicles]
      summary: Upload vehicle images
      description: |
        Multipart form data. Field `images`, up to 8 files per request, at most 5 MB each, JPEG, PNG or WebP
        (checked by declared type and by the file's first bytes). A vehicle can hold 12 images; the first becomes
        the primary image. Files are served from `/uploads/vehicles/{vehicleId}/`. Failures use `UPLOAD_INVALID`.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  maxItems: 8
                  items: { type: string, format: binary }
                altText:
                  type: string
                  maxLength: 160
                  description: Alt text for the uploaded images (defaults to the vehicle name).
      responses:
        '201':
          $ref: '#/components/responses/ImageListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UploadInvalid'
  /api/admin/vehicles/{id}/images/{imageId}:
    patch:
      tags: [Admin - Vehicles]
      summary: Update an image's alt text, order or primary flag
      description: Exactly one image per vehicle is primary. The primary flag cannot be unset directly; set another image as primary instead.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/ImageIdPath' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateImageRequest' }
            example: { altText: Rear three-quarter view, isPrimary: true }
      responses:
        '200':
          $ref: '#/components/responses/ImageListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Admin - Vehicles]
      summary: Delete an image (row and file)
      description: Deleting the primary image promotes the next one.
      parameters:
        - { $ref: '#/components/parameters/IdPath' }
        - { $ref: '#/components/parameters/ImageIdPath' }
      responses:
        '200':
          $ref: '#/components/responses/ImageListResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

