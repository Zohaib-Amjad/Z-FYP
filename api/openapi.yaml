      parameters:
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: manufacturer, in: query, schema: { type: string } }
        - { name: vehicleType, in: query, schema: { $ref: '#/components/schemas/VehicleType' } }
