  responses:
    # ------------------------------------------------------- errors
    Unauthenticated:
      description: Not signed in, or the session is invalid or expired (`UNAUTHENTICATED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: UNAUTHENTICATED, message: Please sign in to continue } }
    Forbidden:
      description: The signed-in role may not use this endpoint (`FORBIDDEN`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: FORBIDDEN, message: You do not have permission to perform this action } }
    NotFound:
      description: The resource does not exist, or belongs to someone else (`NOT_FOUND`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: NOT_FOUND, message: Booking not found } }
    ValidationError:
      description: The request failed validation (`VALIDATION_ERROR`), with one detail per problem field.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: VALIDATION_ERROR
              message: Request validation failed
              details:
                - { field: email, message: Enter a valid email address }
                - { field: zzUnknown, message: This field is not allowed }
    RateLimited:
      description: Too many requests (`RATE_LIMITED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: RATE_LIMITED, message: Too many requests. Please try again later. } }
    Conflict:
      description: |
        The request conflicts with the current state. The code says how: `EMAIL_TAKEN`, `CONFLICT`,
        `SLOT_UNAVAILABLE`, `BOOKING_CONFLICT`, `ACTIVE_BOOKING_LIMIT`, `CANCELLATION_WINDOW_PASSED`,
        `INVALID_STATUS_TRANSITION`, `SLOT_OVERLAP`, `HAS_ACTIVE_BOOKINGS` or `SLOT_IN_PAST`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: SLOT_UNAVAILABLE, message: This time slot is no longer available. Please choose another slot } }
    InvalidTransition:
      description: The booking's current status does not allow this action (`INVALID_STATUS_TRANSITION`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: INVALID_STATUS_TRANSITION
              message: 'A booking cannot move from APPROVED to APPROVED. Allowed next statuses: RESCHEDULED, CANCELLED, COMPLETED'
    HasActiveBookings:
      description: Future active bookings (or, for a vehicle's dealerships, active slots) block the change (`HAS_ACTIVE_BOOKINGS` or `CONFLICT`). `details` carries the count.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: HAS_ACTIVE_BOOKINGS
              message: This dealership has 2 upcoming active bookings. Cancel or reschedule them before deactivating.
              details: [{ field: activeBookingCount, message: '2' }]
    SlotOverlap:
      description: The slot overlaps another active slot of the same vehicle (`SLOT_OVERLAP`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example:
            success: false
            error:
              code: SLOT_OVERLAP
              message: This time overlaps another active slot for the same vehicle
              details: [{ field: startAt, message: 'Overlaps slot 6b2c9d4e-0f8a-4a52-9a67-1d3b5c7e9f01 (2030-03-12T10:00:00.000Z to 2030-03-12T11:00:00.000Z) at Prestige Mayfair' }]
    SlotConflict:
      description: The slot is booked (`HAS_ACTIVE_BOOKINGS`), has started (`SLOT_IN_PAST`) or the new time overlaps another slot (`SLOT_OVERLAP`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: HAS_ACTIVE_BOOKINGS, message: 'This slot has an active booking. Reschedule the booking to another slot instead of changing this slot.' } }
    InvalidCredentials:
      description: Wrong email or password (`INVALID_CREDENTIALS`); the answer is identical for unknown emails.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: INVALID_CREDENTIALS, message: The email or password you entered is incorrect } }
    AccountDisabled:
      description: The account has been deactivated (`ACCOUNT_DISABLED`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: ACCOUNT_DISABLED, message: This account has been deactivated } }
    UploadInvalid:
      description: A file is the wrong type, too large, or over the limits (`UPLOAD_INVALID`).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          example: { success: false, error: { code: UPLOAD_INVALID, message: '"notes.txt" is not a valid JPEG, PNG or WebP image' } }

    # ----------------------------------------------------- successes
    HealthResponse:
      description: The service and its database are up.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, enum: [true] }
              data:
                type: object
                properties:
                  status: { type: string, example: ok }
                  database: { type: string, example: up }
          example: { success: true, data: { status: ok, database: up } }
    NullResponse:
      description: Done. `data` is null.
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, enum: [true] }
              message: { type: string }
              data: { nullable: true }
          example: { success: true, message: Signed out successfully, data: null }
